name: sub
on:
  push:
    paths: ["n3/sub/trigger.txt"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          pip install --quiet faster-whisper requests playwright && python -m playwright install --with-deps chromium > /dev/null
          G=https://raw.githubusercontent.com/google/fonts/b5efa9c32e8f9b63005f5cdb1ad5527a77d2cd04/ofl
          mkdir -p fonts
          curl -fsSL -o fonts/MPLUSRounded1c-Bold.ttf "$G/mplusrounded1c/MPLUSRounded1c-Bold.ttf"
          curl -fsSL -o fonts/NotoSansMyanmar.ttf     "$G/notosansmyanmar/NotoSansMyanmar%5Bwdth%2Cwght%5D.ttf"
      - name: Run (trigger line = "STEP NAME", e.g. "all own_test")
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          read step name < n3/sub/trigger.txt
          python -u n3/sub/sub.py $step $name
          git config user.name rio-bot; git config user.email rio-bot@users.noreply.github.com
          git add n3/sub/jobs n3/sub/out && git commit -qm "sub $step $name [skip ci]" && git pull -q --rebase && git push -q || true
