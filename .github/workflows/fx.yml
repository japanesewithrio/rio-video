name: fx
on:
  push:
    paths: ["fx/trigger.txt"]
  schedule:
    # hourly; the first run at/after 20:00 JST (Mon-Fri) also sends the Burmese report
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Send the Burmese evening report to Telegram now"
        type: boolean
        default: false
concurrency:
  group: fx
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install --quiet yfinance pandas numpy
      - name: Run paper bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FX_REPORT: ${{ inputs.report && '1' || '' }}
        run: gunzip -c fx.py.gz > fx.py && python fx.py
      - name: Commit
        run: |
          git config user.name "rio-bot"
          git config user.email "rio-bot@users.noreply.github.com"
          git add fx
          git diff --cached --quiet || git commit -q -m "fx report"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
