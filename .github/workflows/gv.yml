name: gv
on:
  push:
    paths: ["n3/gv/job.json"]
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests numpy
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u n3/gv/run.py
      - if: always()
        run: |
          git config user.name "rio-bot"; git config user.email "rio-bot@users.noreply.github.com"
          git add n3/gv/out 2>/dev/null; git commit -qm "gemini voice [skip ci]" && git pull -q --rebase && git push -q || echo nothing
