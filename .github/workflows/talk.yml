name: talk
on:
  push:
    paths: ["n3/talk/job.json"]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      vv:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client requests
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u n3/talk/run.py
      - if: always()
        run: |
          git config user.name "rio-bot"; git config user.email "rio-bot@users.noreply.github.com"
          git add n3/talk/out && git commit -qm "talk test [skip ci]" && git pull -q --rebase && git push -q || echo nothing
