name: clip
on:
  push:
    paths: ["n3/sub/clip.txt"]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          pip install --quiet -U yt-dlp faster-whisper requests playwright && python -m playwright install --with-deps chromium > /dev/null
          G=https://raw.githubusercontent.com/google/fonts/b5efa9c32e8f9b63005f5cdb1ad5527a77d2cd04/ofl
          mkdir -p fonts
          curl -fsSL -o fonts/MPLUSRounded1c-Bold.ttf "$G/mplusrounded1c/MPLUSRounded1c-Bold.ttf"
          curl -fsSL -o fonts/NotoSansMyanmar.ttf     "$G/notosansmyanmar/NotoSansMyanmar%5Bwdth%2Cwght%5D.ttf"
      - name: Fetch the clip (line 1 of clip.txt = "NAME URL START END STEP")
        run: |
          read name url a b step < n3/sub/clip.txt
          mkdir -p n3/sub/in
          yt-dlp -f "bv*[height<=1080][ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b" --download-sections "*$a-$b" --force-keyframes-at-cuts \
                 --merge-output-format mp4 -o "n3/sub/in/$name.mp4" "$url" 2>&1 | tail -20
          ls -la n3/sub/in
          echo "name=$name" >> $GITHUB_ENV; echo "step=$step" >> $GITHUB_ENV
      - name: Subtitles
        if: env.step != 'fetch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python -u n3/sub/sub.py ${step:-all} $name
      - uses: actions/upload-artifact@v4
        with:
          name: clip
          path: |
            n3/sub/in/*.mp4
            /tmp/sub_out/*.mp4
          if-no-files-found: ignore
      - name: Save the lines (text only, never the video)
        run: |
          git config user.name rio-bot; git config user.email rio-bot@users.noreply.github.com
          git add n3/sub/jobs && git commit -qm "clip lines $name [skip ci]" && git pull -q --rebase && git push -q || true
