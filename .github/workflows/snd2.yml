name: snd2
on:
  push:
    paths: ["n3/snd/fetch.py", "n3/snd/ace.json"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client requests
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u n3/snd/fetch.py; python -u n3/snd/ace.py
      - if: always()
        run: |
          git config user.name "rio-bot"; git config user.email "rio-bot@users.noreply.github.com"
          git add n3/snd/out 2>/dev/null; git commit -qm "music [skip ci]" && git pull -q --rebase && git push -q || echo nothing
