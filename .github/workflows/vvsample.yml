name: vvsample
on:
  push:
    paths: ["n3/vv/sample.py"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      vv:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python n3/vv/sample.py
      - run: |
          git config user.name "rio-bot"; git config user.email "rio-bot@users.noreply.github.com"
          git add n3/vv && git commit -qm "VOICEVOX samples [skip ci]" && git pull -q --rebase && git push -q
