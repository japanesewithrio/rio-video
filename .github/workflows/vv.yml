name: vv
on:
  push:
    paths: ["n3/vv/lines.json"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python -u n3/vv/run.py
      - run: |
          git config user.name rio-bot; git config user.email rio-bot@users.noreply.github.com
          git add n3/gv/out && git commit -qm "vv voices [skip ci]" && for k in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done || echo nothing
