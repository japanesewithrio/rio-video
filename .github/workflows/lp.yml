name: lp
on:
  push:
    paths: ["n3/lp/jobs.json", "n3/lp/run.py"]
permissions:
  contents: write
jobs:
  l:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u n3/lp/run.py
      - if: always()
        run: |
          git config user.name rio-bot; git config user.email rio-bot@users.noreply.github.com
          git add n3/lp/out && git commit -qm "lp clips [skip ci]" && for k in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done || echo nothing
